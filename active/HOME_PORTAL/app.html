<!-- html5-qrcode CDN -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<div class="qr-overlay" id="qr-overlay" role="dialog" aria-modal="true" aria-labelledby="qr-title">
  <div class="qr-header">
    <h3 id="qr-title">Scan QR / Barcode</h3>
    <p>Arahkan kamera ke QR Code atau Barcode kartu MK / NIK</p>
  </div>
  <div class="qr-viewport">
    <div id="qr-reader"></div>
  </div>
  <div class="qr-result-text" id="qr-result-text"></div>
  <div class="qr-loading" id="qr-loading"></div>
  <div class="qr-diagnostic" id="qr-diagnostic"></div>
  
  <input type="file" id="qr-fallback-input" accept="image/*" capture="environment" style="display:none;" onchange="handleFallbackImage(event)">
  <button class="qr-close-btn" id="qr-fallback-btn" type="button" style="background:#0077b6; margin-bottom:10px; display:none;" onclick="document.getElementById('qr-fallback-input').click()">📸 AMBIL FOTO</button>
  <button class="qr-close-btn" id="qr-close-btn" data-action="close-qr" type="button">TUTUP</button>
</div>

<div class="scan-toast" id="scan-toast" role="status" aria-live="polite"></div>

<script>
// ── QR Scanner State ──────────────────────────────────────
const QR = {
  html5QrCode: null,
  stream: null,
  video: null,
  detector: null,
  scanFrame: null,
  isScanning: false,
  isStarting: false,
  isStopping: false,
  context: null,
  usingNative: false,
  successHandled: false,
  tesseractLoader: null,
  pendingValue: null,
  pendingSince: 0
};

// ── State ──────────────────────────────────────────────────
const STATE = {
  currentUser: null,
  masuk:    { selectedNIK: null, selectedNama: null, selectedType: null, selectedDept: null, selectedJabatan: null, scannedSerial: null, completed: false },
  keluar:   { scannedSerial: null, bindingData: null },
  security: { scannedSerial: null, selectedArea: '', shiftLabel: '', storageKey: '' },
  dashboard: { basis: 'today', dateValue: '', weekValue: '', monthValue: '', shiftValue: 'shift1', areaItems: [], selectedAreaLabel: '', deptItems: [], selectedDeptLabel: '', selectedDeptIndex: 0 }
};

function detectClientShiftLabel() {
  const hour = new Date().getHours();
  if (hour >= 6 && hour < 14) return 'Shift 1';
  if (hour >= 14 && hour < 22) return 'Shift 2';
  return 'Shift 3';
}

function buildSecurityAreaStorageKey() {
  const nik = STATE.currentUser && STATE.currentUser.nik ? STATE.currentUser.nik : 'guest';
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm   = String(now.getMonth() + 1).padStart(2, '0');
  const dd   = String(now.getDate()).padStart(2, '0');
  return `dam_security_area_${nik}_${yyyy}${mm}${dd}_${detectClientShiftLabel().replace(/\s+/g, '_')}`;
}

function applySecurityAreaUiState() {
  const select      = document.getElementById('security-area-select');
  const hint        = document.getElementById('security-area-hint');
  const scanButton  = document.querySelector('[onclick="openLiveScanner(\'security\')"]');
  const serialInput = document.getElementById('security-serial');
  const serialSubmit = document.querySelector('[data-context="security"][data-action="submit-serial"]');
  const selectedArea = STATE.security.selectedArea;
  const shiftLabel   = STATE.security.shiftLabel || detectClientShiftLabel();
  const ready = Boolean(selectedArea);

  if (select) select.value = selectedArea || '';
  if (hint) {
    hint.textContent = selectedArea
      ? `Area shift aktif: ${selectedArea} (${shiftLabel}). Semua scan akan masuk ke area ini.`
      : `Pilih area sekali di awal ${shiftLabel}. Semua scan berikutnya akan otomatis tercatat ke area itu.`;
  }
  if (scanButton)   scanButton.disabled   = !ready;
  if (serialInput)  serialInput.disabled  = !ready;
  if (serialSubmit) serialSubmit.disabled = !ready;
}

function syncSecurityAreaShift() {
  STATE.security.shiftLabel  = detectClientShiftLabel();
  STATE.security.storageKey  = buildSecurityAreaStorageKey();
  let savedArea = '';
  try { savedArea = localStorage.getItem(STATE.security.storageKey) || ''; } catch (_) {}
  STATE.security.selectedArea = savedArea;
  applySecurityAreaUiState();
}

function saveSecurityAreaShift() {
  const select = document.getElementById('security-area-select');
  const area = select ? String(select.value || '').trim() : '';
  if (!area) { showResult('security', 'error', 'Pilih area pengawasan terlebih dahulu.'); return; }
  STATE.security.shiftLabel  = detectClientShiftLabel();
  STATE.security.storageKey  = buildSecurityAreaStorageKey();
  STATE.security.selectedArea = area;
  try { localStorage.setItem(STATE.security.storageKey, area); } catch (_) {}
  applySecurityAreaUiState();
  showResult('security', 'success', `Area shift disimpan: <strong>${escHtml(area)}</strong> (${escHtml(STATE.security.shiftLabel)}).`);
}

const REQUEST_BUSY = {
  masukConfirm: false,
  keluarScan: false,
  keluarConfirm: false,
  securityScan: false
};

const REPORT_CACHE = {
  absen: null
};

function getIncomingSessionNik() {
  // Baca langsung dari URL — lebih reliable dari template injection
  try {
    const params = new URLSearchParams(window.location.search);
    const urlNik = (params.get('nik') || '').trim();
    if (urlNik) return urlNik;
  } catch (_) {}
  // Fallback ke template-injected value
  if (typeof GLOBAL_SESSION_NIK === 'undefined') return '';
  return String(GLOBAL_SESSION_NIK || '').trim();
}

function setLoginUiMode(mode, message) {
  const loginPage = document.getElementById('page-login');
  const loginForm = document.getElementById('login-form-content');
  const sessionBootstrap = document.getElementById('session-bootstrap');
  if (!loginPage || !loginForm || !sessionBootstrap) return;

  if (mode === 'bootstrapping') {
    loginPage.style.display = 'flex';
    loginPage.classList.add('active');
    loginForm.style.display = 'none';
    sessionBootstrap.style.display = 'block';
    sessionBootstrap.textContent = message || 'Memuat sesi dari Home Portal...';
    return;
  }

  sessionBootstrap.style.display = 'none';
  loginForm.style.display = 'block';
  loginPage.style.display = 'flex';
  loginPage.classList.add('active');
}

function hydrateAuthenticatedUser(user, depts) {
  STATE.currentUser = user;
  if (Array.isArray(depts) && depts.length) STATE.availableDepts = depts;

  localStorage.setItem('dam_session', JSON.stringify({
    user: { ...user },
    depts: Array.isArray(depts) ? depts : (STATE.availableDepts || []),
    exp: Date.now() + 7 * 24 * 60 * 60 * 1000
  }));



  const validRoles  = ['ADMINISTRATOR', 'PENGAWAS', 'SECURITY'];
  const isAssistRole = validRoles.includes(user.role);

  if (isAssistRole) {
    // SECURITY / PENGAWAS / ADMINISTRATOR: form masuk kosong, harus cari karyawan
    STATE.masuk.selectedNIK     = null;
    STATE.masuk.selectedNama    = null;
    STATE.masuk.selectedType    = null;
    STATE.masuk.selectedDept    = null;
    STATE.masuk.selectedJabatan = null;
    STATE.masuk.completed       = false;
    const inNik     = document.getElementById('masuk-nik');
    const inNama    = document.getElementById('masuk-nama-input');
    const inDept    = document.getElementById('masuk-dept');
    const inJabatan = document.getElementById('masuk-jabatan');
    if (inNik)     inNik.value     = '';
    if (inNama)    inNama.value    = '';
    if (inDept)    inDept.value    = '';
    if (inJabatan) inJabatan.value = '';
  } else {
    // KARYAWAN: pre-fill dengan data sendiri
    STATE.masuk.selectedNIK     = user.nik;
    STATE.masuk.selectedNama    = user.nama;
    STATE.masuk.selectedType    = user.type;
    STATE.masuk.selectedDept    = user.dept;
    STATE.masuk.selectedJabatan = user.jabatan;
    STATE.masuk.completed       = false;
    const inNik     = document.getElementById('masuk-nik');
    const inNama    = document.getElementById('masuk-nama-input');
    const inDept    = document.getElementById('masuk-dept');
    const inJabatan = document.getElementById('masuk-jabatan');
    if (inNik)     inNik.value     = user.nik;
    if (inNama)    inNama.value    = user.nama;
    if (inDept)    inDept.value    = user.dept || '';
    if (inJabatan) inJabatan.value = user.jabatan || '';
  }

  applyRolePermissions(user.role);
  syncAreaDeptFilterOptions();
  updateMasukScannerVisibility();
}

function restoreSavedSession() {
  const savedSession = localStorage.getItem('dam_session');
  if (!savedSession) return false;

  try {
    const parsed = JSON.parse(savedSession);
    const exp = parsed && parsed.exp;
    const sessionUser = parsed && parsed.user ? parsed.user : parsed;
    const sessionDepts = parsed && Array.isArray(parsed.depts) ? parsed.depts : STATE.availableDepts;
    if (exp && Date.now() > exp) {
      localStorage.removeItem('dam_session');
      return false;
    }
    hydrateAuthenticatedUser(sessionUser, sessionDepts);
    if ((!Array.isArray(sessionDepts) || !sessionDepts.length) && sessionUser && sessionUser.nik) {
      refreshSessionCatalog(sessionUser.nik);
    }
    return true;
  } catch (e) {
    localStorage.removeItem('dam_session');
    return false;
  }
}

function refreshSessionCatalog(nik) {
  const targetNik = asText(nik).trim();
  if (!targetNik) return;

  google.script.run
    .withFailureHandler(() => {})
    .withSuccessHandler(res => {
      if (!res || !res.ok || !res.karyawan) return;
      hydrateAuthenticatedUser(res.karyawan, res.depts || []);
    })
    .verifySession(targetNik);
}

function beginModuleAutoLogin(sessionNik) {
  const nik = (sessionNik || getIncomingSessionNik()).trim();
  if (!nik) return false;

  STATE.authBootPending = true;
  setLoginUiMode('bootstrapping', 'Memuat sesi dari Home Portal...');

  google.script.run
    .withFailureHandler(err => {
      STATE.authBootPending = false;
      if (!restoreSavedSession()) {
        setLoginUiMode('login');
        showScanToast('Gagal memverifikasi sesi: ' + getErrorMessage(err));
      }
    })
    .withSuccessHandler(res => {
      STATE.authBootPending = false;
      if (res && res.ok) {
        applyAuthenticatedSession(res);
      } else if (!restoreSavedSession()) {
        setLoginUiMode('login');
        showScanToast((res && res.msg) || 'Sesi tidak valid.');
      }
    })
    .verifySession(nik);

  return true;
}

// ── AUTHENTICATION ─────────────────────────────────────────
function applyRolePermissions(role) {
  const TABS = {
    'masuk': ['ADMINISTRATOR', 'SECURITY', 'KARYAWAN'],
    'keluar': ['ADMINISTRATOR', 'SECURITY', 'KARYAWAN'],
    'security': ['SECURITY', 'PENGAWAS'], 
    'dashboard': ['ADMINISTRATOR', 'PENGAWAS'],
    'cek-absen': ['ADMINISTRATOR', 'PENGAWAS', 'SECURITY', 'KARYAWAN'],
    'cek-area': ['ADMINISTRATOR', 'PENGAWAS', 'SECURITY'],
    'export-laporan': ['ADMINISTRATOR'],
    'revisi-catatan': ['ADMINISTRATOR']
  };

  let defaultTab = null;
  const validRoles = ['ADMINISTRATOR', 'PENGAWAS', 'SECURITY'];
  const roleKey = validRoles.includes(role) ? role : 'KARYAWAN';

  // Default tabs
  if (roleKey === 'ADMINISTRATOR') defaultTab = 'dashboard';
  else if (roleKey === 'PENGAWAS') defaultTab = 'security';
  else if (roleKey === 'SECURITY') defaultTab = 'security';
  else defaultTab = 'masuk';

  for (const tab in TABS) {
    const btn = document.getElementById('tab-btn-' + tab);
    if (TABS[tab].includes(roleKey)) {
      if (btn) btn.style.display = 'flex';
    } else {
      if (btn) btn.style.display = 'none';
    }
  }

    const userNameEl = document.getElementById('header-user-name');
  if (userNameEl && STATE.currentUser) {
    const firstName = (STATE.currentUser.nama || 'User').split(' ')[0];
    userNameEl.textContent = firstName + ' (' + roleKey + ')';
    
    const absenNik = document.getElementById('cek-absen-nik');
    if (absenNik && roleKey === 'KARYAWAN') {
      absenNik.value = STATE.currentUser.nik;
      absenNik.disabled = true;
    } else if (absenNik) {
      absenNik.value = '';
      absenNik.disabled = false;
    }
    
    const masukSearch    = document.getElementById('masuk-nik-input');
    const areaDeptSelect = document.getElementById('cek-area-dept');
    const masukBanner    = document.getElementById('masuk-assist-banner');
    const masukSearchFld = document.getElementById('masuk-search-field');
    const masukDivider   = document.getElementById('masuk-data-divider');

    if (roleKey === 'KARYAWAN') {
      // Karyawan: search hidden, data pre-filled
      if (masukSearch)    { masukSearch.disabled = true; }
      if (masukSearchFld) masukSearchFld.style.display = 'none';
      if (masukBanner)    masukBanner.style.display = 'none';
      if (masukDivider)   masukDivider.style.display = 'none';
      if (areaDeptSelect) {
        areaDeptSelect.value = '';
        areaDeptSelect.disabled = false;
      }
    } else {
      // SECURITY / PENGAWAS / ADMINISTRATOR: search prominent, banner aktif
      if (masukSearch)    { masukSearch.disabled = false; masukSearch.placeholder = 'Ketik NIK atau nama karyawan...'; }
      if (masukSearchFld) masukSearchFld.style.display = 'block';
      if (masukBanner)    masukBanner.style.display = 'block';
      if (masukDivider)   masukDivider.style.display = 'block';
      if (areaDeptSelect && roleKey === 'PENGAWAS') {
        areaDeptSelect.value = STATE.currentUser.dept || '';
        areaDeptSelect.disabled = true;
      } else if (areaDeptSelect) {
        areaDeptSelect.disabled = false;
      }
    }
  }

  // Switch to default tab
  if (defaultTab) switchTab(defaultTab);
  
  // Show header and tab bar
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('app-tabbar').style.display = 'flex';
  
  // Hide login page
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-login').style.display = 'none';
}

function handleLoginSubmit() {
  const nik = (document.getElementById('login-nik').value || '').trim();
  const pwd = (document.getElementById('login-password').value || '').trim();
  
  if (!nik) {
    showScanToast("NIK wajib diisi.");
    return;
  }
  
  const btn = document.querySelector('.btn-login');
  btn.classList.add('pulse-anim');
  btn.innerHTML = 'MASUK...';
  btn.disabled = true;
  
  google.script.run
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.classList.remove('pulse-anim');
      btn.innerHTML = 'MASUK';
      showScanToast('Error koneksi: ' + err.message);
    })
    .withSuccessHandler(res => {
      btn.disabled = false;
      btn.classList.remove('pulse-anim');
      btn.innerHTML = 'MASUK';
      if (!res.ok) {
        showScanToast(res.msg);
        return;
      }
      applyAuthenticatedSession(res);
    })
    .verifyLogin(nik, pwd);
}

function applyAuthenticatedSession(res) {
  hydrateAuthenticatedUser(res.karyawan, res.depts);
}

function buildModuleTokenParams(extraParams) {
  const params = new URLSearchParams();
  if (STATE.currentUser && STATE.currentUser.nik) params.set('nik', STATE.currentUser.nik);
  Object.entries(extraParams || {}).forEach(([key, value]) => {
    if (value === undefined || value === null) return;
    const normalized = String(value).trim();
    if (normalized) params.set(key, normalized);
  });
  const query = params.toString();
  return query ? '?' + query : '';
}

// ── Tab switching — semua lokal di shell ──────────────────
async function switchTab(tab) {
  const tabbar = document.getElementById('app-tabbar');
  const overlay = document.getElementById('sidebar-overlay');
  if (tabbar) tabbar.classList.remove('open');
  if (overlay) overlay.classList.remove('active');

  if (typeof QR !== 'undefined' && (QR.isScanning || QR.isStarting)) {
    if (typeof stopQRScanner === 'function') await stopQRScanner();
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  const pageEl = document.getElementById('page-' + tab);
  const btnEl  = document.getElementById('tab-btn-' + tab);
  if (pageEl) pageEl.classList.add('active');
  if (btnEl)  btnEl.classList.add('active');

  if (typeof resetAllSerialInputs === 'function') resetAllSerialInputs();
  ['masuk', 'keluar', 'security'].forEach(ctx => {
    const el = document.getElementById(ctx + '-result');
    if (el) { el.className = 'result-card'; el.innerHTML = ''; }
  });

  if (tab === 'dashboard') loadDashboard();
  if (tab === 'security')  { loadRecentLogs(); syncSecurityAreaShift(); }
  if (tab === 'cek-absen' || tab === 'cek-area') updatePeriodInput(tab);
}

// ── Debounce search ────────────────────────────────────────
let searchTimer = null;
function debounceSearch(q, context) {
  clearTimeout(searchTimer);
  if (q.length < 2) { closeList(context); return; }
  searchTimer = setTimeout(() => doSearch(q, context), 400);
}

function doSearch(q, context) {
  google.script.run
    .withFailureHandler(err => handleGasFailure(context, err))
    .withSuccessHandler(res => renderList(res, context))
    .searchKaryawan(q);
}

function renderList(res, context) {
  const list = document.getElementById(context + '-list');
  if (!list) return;
  list.innerHTML = '';
  if (!res.ok) { showResult(context, 'error', 'Gagal mencari karyawan: ' + escHtml(res.msg)); return; }
  if (!res.data.length) { list.style.display='none'; return; }

  res.data.forEach(k => {
    const item = document.createElement('div');
    const name = document.createElement('div');
    const detail = document.createElement('div');
    item.className = 'autocomplete-item';
    name.textContent = k.nama || '-';
    detail.className = 'item-nik';
    detail.textContent = `${k.nik || '-'} - ${k.dept || '-'} - ${k.jabatan || '-'}`;
    item.addEventListener('click', () => selectKaryawan(context, k.nik || '', k.nama || '', k.type || '', k.dept || '', k.jabatan || ''));
    item.appendChild(name);
    item.appendChild(detail);
    list.appendChild(item);
  });
  list.style.display = 'block';
}

function closeList(context) {
  const el = document.getElementById(context + '-list');
  if (el) el.style.display = 'none';
}

function selectKaryawan(context, nik, nama, type, dept, jabatan) {
  STATE[context].selectedNIK     = nik;
  STATE[context].selectedNama    = nama;
  STATE[context].selectedType    = type;
  STATE[context].selectedDept    = dept;
  STATE[context].selectedJabatan = jabatan;
  if (context === 'masuk') {
    STATE.masuk.completed = false;
    // Tampilkan divider "Data Karyawan Terpilih" saat karyawan dipilih
    const divider = document.getElementById('masuk-data-divider');
    if (divider) divider.style.display = 'block';
  }

  const searchInput = document.getElementById(context + '-search') || document.getElementById(context + '-nik-input');
  if (searchInput) searchInput.value = nama + ' (' + nik + ')';
  const nikInput = document.getElementById(context + '-nik');
  const namaInput = document.getElementById(context + '-nama-input');
  const deptInput = document.getElementById(context + '-dept');
  const jabatanInput = document.getElementById(context + '-jabatan');
  if (nikInput) nikInput.value = nik;
  if (namaInput) namaInput.value = nama;
  if (deptInput) deptInput.value = dept || '';
  if (jabatanInput) jabatanInput.value = jabatan || '';
  closeList(context);

  const info = document.getElementById(context + '-karyawan-info');
  if (info) {
    document.getElementById(context + '-avatar').textContent = nama.charAt(0);
    document.getElementById(context + '-nama').textContent   = nama;
    document.getElementById(context + '-detail').textContent = nik + ' - ' + dept + ' - ' + jabatan;
    document.getElementById(context + '-type').textContent   = type || 'KARYAWAN';
    info.style.display = 'block';
  }

  updateMasukScannerVisibility();
}

// ── Manual serial submit ────────────────────────────────────
function submitSerial(context) {
  const val = normalizeSerial(document.getElementById(context + '-serial').value);
  if (!val) { showResult(context, 'error', 'Masukkan nomor kartu MK / NIK terlebih dahulu.'); return; }
  if (!isValidSerial(val)) { showResult(context, 'error', 'Format nomor kartu MK / NIK tidak valid.'); return; }
  onSerialScanned(context, val);
}

// ── On serial received (NFC or manual) ────────────────────
function onSerialScanned(context, serial) {
  serial = normalizeSerial(serial);
  if (!isValidSerial(serial)) {
    showResult(context, 'error', 'Format nomor kartu MK / NIK tidak valid.');
    return;
  }
  document.getElementById(context + '-serial').value = serial;

  if (context === 'masuk') {
    STATE.masuk.completed = false;
    STATE.masuk.scannedSerial = serial;
    const display = document.getElementById('masuk-card-display');
    document.getElementById('masuk-card-num').textContent = serial;
    display.style.display = 'block';
    setRescanVisibility('masuk', true);
    showResult('masuk', 'warning', `Kartu <strong>${escHtml(serial)}</strong> sudah terbaca. Periksa dulu, lalu pilih <strong>KONFIRMASI MASUK PABRIK</strong> atau <strong>SCAN ULANG KARTU</strong> jika salah scan.`);
    checkMasukReady();

  } else if (context === 'keluar') {
    if (REQUEST_BUSY.keluarScan) return;
    REQUEST_BUSY.keluarScan = true;
    STATE.keluar.scannedSerial = serial;
    setRescanVisibility('keluar', true);
    showResult('keluar', 'warning', 'Memeriksa kartu...');
    google.script.run
      .withFailureHandler(err => {
        REQUEST_BUSY.keluarScan = false;
        handleGasFailure('keluar', err);
      })
      .withSuccessHandler(res => handleKeluarScan(res, serial))
      .getBindingStatus(serial);

  } else if (context === 'security') {
    const area = (STATE.security.selectedArea || '').trim();
    if (!area) { showResult('security', 'error', 'Pilih area pengawasan terlebih dahulu, lalu klik SET AREA.'); return; }

    const reasonRadio = document.querySelector('input[name="security_reason"]:checked');
    const reason = reasonRadio ? reasonRadio.value : '';

    const modeRadio = document.querySelector('input[name="security_mode"]:checked');
    const forceMode = modeRadio ? modeRadio.value : 'AUTO';

    if (REQUEST_BUSY.securityScan) return;
    REQUEST_BUSY.securityScan = true;
    STATE.security.scannedSerial = serial;
    showResult('security', 'warning', 'Mencatat...');
    google.script.run
      .withFailureHandler(err => {
        REQUEST_BUSY.securityScan = false;
        handleGasFailure('security', err);
      })
      .withSuccessHandler(handleSecurityScan)
      .scanAreaKerja(serial, area, reason, forceMode);
  }
}

// ── MASUK: Check ready & confirm ───────────────────────────
function isExternalUser(type, jabatan, dept) {
  const marker = [type, jabatan, dept].join(' ').toUpperCase();
  return ['MITRA', 'VISITOR', 'TAMU', 'EXTERNAL', 'EKSTERNAL', 'VENDOR', 'KONTRAKTOR', 'OUTSOURCE', 'OUTSOURCING']
    .some(keyword => marker.includes(keyword));
}

function isInternalUser(type, jabatan, dept) {
  return !isExternalUser(type, jabatan, dept);
}

function updateMasukScannerVisibility() {
  const s = STATE.masuk;
  const card = document.getElementById('masuk-scanner-card');
  if (card) {
    const isInternal = isInternalUser(s.selectedType, s.selectedJabatan, s.selectedDept);
    card.style.display = isInternal ? 'none' : 'block';
  }
  checkMasukReady();
}

function checkMasukReady() {
  const s = STATE.masuk;
  const btn = document.getElementById('masuk-confirm');
  if (!btn) return;
  const internal = isInternalUser(s.selectedType, s.selectedJabatan, s.selectedDept);
  if (!s.completed && s.selectedNIK && (internal || s.scannedSerial)) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}

function confirmMasuk() {
  if (REQUEST_BUSY.masukConfirm) return;
  const s = STATE.masuk;
  const internal = isInternalUser(s.selectedType, s.selectedJabatan, s.selectedDept);
  
  if (!s.selectedNIK) return;
  if (!internal && !s.scannedSerial) return;

  const loker = (document.getElementById('masuk-loker').value || '').trim();
  const serialToSend = internal ? s.selectedNIK : s.scannedSerial;

  REQUEST_BUSY.masukConfirm = true;
  setActionBusy('confirm-masuk', true);
  showResult('masuk', 'warning', 'Memproses...');
  document.getElementById('masuk-confirm').classList.remove('visible');

  let reqTimeout = setTimeout(() => {
    REQUEST_BUSY.masukConfirm = false;
    setActionBusy('confirm-masuk', false);
    showResult('masuk', 'error', 'Koneksi lambat atau terputus. Jika Anda sudah berhasil scan di perangkat lain/sheet, abaikan pesan ini. Silakan muat ulang halaman.');
    document.getElementById('masuk-confirm').classList.add('visible');
  }, 35000);

  google.script.run
    .withFailureHandler(err => {
      clearTimeout(reqTimeout);
      REQUEST_BUSY.masukConfirm = false;
      setActionBusy('confirm-masuk', false);
      handleGasFailure('masuk', err);
      document.getElementById('masuk-confirm').classList.add('visible');
    })
    .withSuccessHandler(res => {
      clearTimeout(reqTimeout);
      REQUEST_BUSY.masukConfirm = false;
      setActionBusy('confirm-masuk', false);
      if (res.ok) {
        showResult('masuk', 'success',
          `<strong>${escHtml(res.karyawan.nama)}</strong> berhasil masuk pabrik.<br>
           <span class="meta">Kartu: ${escHtml(res.noKartuMK)} - ${escHtml(res.waktu)} - ${escHtml(res.shift)}</span>`);
        resetMasuk();
      } else {
        if (res.htmlMsg) {
          showResult('masuk', 'error', res.htmlMsg);
        } else {
          showResult('masuk', 'error', escHtml(res.msg));
        }
        document.getElementById('masuk-confirm').classList.add('visible');
      }
    })
    .bindKartu(serialToSend, s.selectedNIK, loker);
}

window.forceReleaseOldCard = function(oldKartu) {
  if (!confirm(`Yakin ingin me-release (membebaskan) kartu ${oldKartu} secara paksa?`)) return;
  
  showResult('masuk', 'warning', `Mencoba me-release paksa kartu ${oldKartu}...`);
  document.getElementById('masuk-confirm').classList.remove('visible');
  
  let reqTimeout = setTimeout(() => {
    showResult('masuk', 'error', 'Waktu request habis. Cek koneksi internet Anda atau muat ulang halaman.');
    document.getElementById('masuk-confirm').classList.add('visible');
  }, 35000);

  google.script.run
    .withFailureHandler(err => {
      clearTimeout(reqTimeout);
      showResult('masuk', 'error', 'Gagal release paksa: ' + escHtml(getErrorMessage(err)));
    })
    .withSuccessHandler(res => {
      clearTimeout(reqTimeout);
      if (res.ok) {
        showResult('masuk', 'success', `✅ Kartu ${oldKartu} berhasil dilepas secara paksa.<br>Silakan klik <strong>KONFIRMASI MASUK PABRIK</strong> kembali untuk mengikat kartu baru.`);
        document.getElementById('masuk-confirm').classList.add('visible');
      } else {
        showResult('masuk', 'error', 'Gagal: ' + escHtml(res.msg));
      }
    })
    .releaseKartu(oldKartu, 'FORCE_RELEASE');
};

// ── KELUAR: Handle scan & confirm ──────────────────────────
function handleKeluarScan(res, serial) {
  REQUEST_BUSY.keluarScan = false;
  if (!res.ok) {
    showResult('keluar', 'error', escHtml(res.msg));
    const serialInput = document.getElementById('keluar-serial');
    if (serialInput) serialInput.value = '';
    STATE.keluar.scannedSerial = null;
    STATE.keluar.bindingData = null;
    resetKeluarUi();
    return;
  }
  if (res.status !== 'BOUND') {
    showResult('keluar', 'error', `Kartu <strong>${escHtml(serial)}</strong> tidak dalam status terikat / tidak dikenal.`);
    const serialInput = document.getElementById('keluar-serial');
    if (serialInput) serialInput.value = '';
    STATE.keluar.scannedSerial = null;
    STATE.keluar.bindingData = null;
    resetKeluarUi();
    return;
  }

  STATE.keluar.bindingData = res;

  showResult('keluar', 'warning',
    `Kartu <strong>${escHtml(serial)}</strong> terikat ke <strong>${escHtml(res.nama)}</strong>.<br>
     <span class="meta">NIK: ${escHtml(res.nik)} - ${escHtml(res.dept)} - Terikat sejak: ${escHtml(res.waktuBind)}</span><br><br>
     Konfirmasi jika karyawan ini akan pulang, atau pilih <strong>SCAN ULANG KARTU</strong> jika salah scan.`);

  document.getElementById('keluar-avatar').textContent  = res.nama.charAt(0);
  document.getElementById('keluar-nama').textContent    = res.nama;
  document.getElementById('keluar-detail').textContent  = res.nik + ' - ' + res.dept;

  document.getElementById('keluar-confirm').classList.add('visible');
}

function confirmKeluar() {
  if (REQUEST_BUSY.keluarConfirm) return;
  const serial = STATE.keluar.scannedSerial;
  if (!serial) return;
  
  const loker = (document.getElementById('keluar-loker').value || '').trim();
  
  REQUEST_BUSY.keluarConfirm = true;
  setActionBusy('confirm-keluar', true);
  showResult('keluar', 'warning', 'Memproses...');
  document.getElementById('keluar-confirm').classList.remove('visible');

  let reqTimeout = setTimeout(() => {
    REQUEST_BUSY.keluarConfirm = false;
    setActionBusy('confirm-keluar', false);
    showResult('keluar', 'error', 'Koneksi lambat atau terputus. Jika data sudah masuk, abaikan pesan ini. Silakan muat ulang halaman.');
    document.getElementById('keluar-confirm').classList.add('visible');
  }, 35000);

  google.script.run
    .withFailureHandler(err => {
      clearTimeout(reqTimeout);
      REQUEST_BUSY.keluarConfirm = false;
      setActionBusy('confirm-keluar', false);
      handleGasFailure('keluar', err);
      document.getElementById('keluar-confirm').classList.add('visible');
    })
    .withSuccessHandler(res => {
      clearTimeout(reqTimeout);
      REQUEST_BUSY.keluarConfirm = false;
      setActionBusy('confirm-keluar', false);
      if (res.ok) {
        showResult('keluar', 'success',
          `<strong>${escHtml(res.karyawan.nama)}</strong> telah keluar pabrik.<br>
           <span class="meta">Kartu ${escHtml(res.noKartuMK)} telah dilepas - ${escHtml(res.waktu)}</span>`);
        STATE.keluar = { scannedSerial:null, bindingData:null };
        document.getElementById('keluar-serial').value = '';
        resetKeluarUi();
      } else {
        showResult('keluar', 'error', escHtml(res.msg));
        document.getElementById('keluar-confirm').classList.add('visible');
      }
    })
    .releaseKartu(serial, loker);
}

// ── SECURITY: Handle scan ──────────────────────────────────
function handleSecurityScan(res) {
  REQUEST_BUSY.securityScan = false;
  if (!res.ok) {
    showResult('security', 'error', escHtml(res.msg));
    const serialInput = document.getElementById('security-serial');
    if (serialInput) serialInput.value = '';
    STATE.security.scannedSerial = null;
  } else {
    const statusLabel = res.inout === 'IN' ? 'MASUK' : 'KELUAR';
    const color = res.inout === 'IN' ? 'success' : 'warning';
    showResult('security', color,
      `<strong>${escHtml(res.karyawan.nama)}</strong><br>
       <span class="meta">${escHtml(res.karyawan.nik)} - ${escHtml(res.karyawan.dept)} - ${escHtml(res.karyawan.jabatan)}</span><br>
       <span class="meta">Kartu: ${escHtml(res.noKartuMK)} - ${escHtml(res.waktu)}</span><br>
       <strong style="font-size:16px">${statusLabel} Area Kerja</strong>`);
    document.getElementById('security-serial').value = '';
    STATE.security.scannedSerial = null;
    setTimeout(loadRecentLogs, 800);
  }
}

              <span style="font-weight:800;color:#0077B6">${k.nama.charAt(0)}</span>
            </div>
            <div class="log-info">
              <strong>${escHtml(k.nama)}</strong>
              <span>${k.nik} - ${escHtml(k.dept)} - ${escHtml(k.type || 'INTERNAL')} - Kartu: ${escHtml(k.noKartuMK || '-')}</span>

function setDashboardBasis(basis) {

  updateDashboardFilterControls();
}

function applyDashboardFilter() {
  loadDashboard();
}

function getDashboardBasisValue(basis) {
  const mode = basis || 'today';
  if (mode === 'shift') {
    return document.getElementById('db-shift-value')?.value || STATE.dashboard.shiftValue || 'shift1';
  }
  if (mode === 'date') {
    return document.getElementById('db-date-value')?.value || STATE.dashboard.dateValue || getDefaultPeriodValue('date');
  }
  if (mode === 'week') {
    return document.getElementById('db-week-value')?.value || STATE.dashboard.weekValue || getDefaultPeriodValue('week');
  }
  if (mode === 'month') {
    return document.getElementById('db-month-value')?.value || STATE.dashboard.monthValue || getDefaultPeriodValue('month');
  }
  return '';
}

function updateDashboardFilterControls() {
  const basis = (STATE.dashboard && STATE.dashboard.basis) || 'today';
  const basisMode = document.getElementById('db-basis-mode');
  const shiftField = document.getElementById('db-shift-field');
  const dateField = document.getElementById('db-date-field');
  const weekField = document.getElementById('db-week-field');
  const monthField = document.getElementById('db-month-field');
  const shiftInput = document.getElementById('db-shift-value');
  const dateInput = document.getElementById('db-date-value');
  const weekInput = document.getElementById('db-week-value');
  const monthInput = document.getElementById('db-month-value');
  if (basisMode) basisMode.value = basis;
  if (shiftInput && !shiftInput.value) shiftInput.value = STATE.dashboard.shiftValue || 'shift1';
  if (dateInput && !dateInput.value) dateInput.value = STATE.dashboard.dateValue || getDefaultPeriodValue('date');
  if (weekInput && !weekInput.value) weekInput.value = STATE.dashboard.weekValue || getDefaultPeriodValue('week');
  if (monthInput && !monthInput.value) monthInput.value = STATE.dashboard.monthValue || getDefaultPeriodValue('month');
  if (shiftField) shiftField.style.display = basis === 'shift' ? 'block' : 'none';
  if (dateField) dateField.style.display = (basis === 'date' || basis === 'shift') ? 'block' : 'none';
  if (weekField) weekField.style.display = basis === 'week' ? 'block' : 'none';
  if (monthField) monthField.style.display = basis === 'month' ? 'block' : 'none';
}

function handleDashboardFilterInput() {

  const shiftInput = document.getElementById('db-shift-value');

function switchDashboardSubtab(subtab) {
  document.querySelectorAll('.db-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
  const section = document.getElementById('db-section-' + subtab);
  const btn     = document.getElementById('db-sub-' + subtab);
  if (section) section.classList.add('active');
  if (btn)     btn.classList.add('active');
  // Lazy-load kehadiran data saat pertama kali masuk sub-tab non-operasional
  if (subtab !== 'operasional' && STATE.dashboard && !STATE.dashboard.kehadiranLoaded) {
    loadKehadiranDashboard();

function populateDeptFilterOptions() {
  const depts = Array.isArray(STATE.availableDepts) ? STATE.availableDepts : [];
  // Dashboard filter
  const sel = document.getElementById('db-dept-filter');
  if (sel) {
    const currentVal = sel.value;

      depts.map(d => `<option value="${escHtml(d)}"${d === currentVal ? ' selected' : ''}>${escHtml(d)}</option>`).join('');

// ── KEHADIRAN DASHBOARD ─────────────────────────────────────

function loadKehadiranDashboard() {
  if (!STATE.dashboard) return;
  // Tentukan tanggal: pakai db-date-value jika basis=date, atau hari ini
  let tanggal = '';
  const basis = STATE.dashboard.basis || 'today';
  if (basis === 'date') {
    tanggal = (document.getElementById('db-date-value') || {}).value || '';
  }
  const shiftFilter = (document.getElementById('db-shift-value') || {}).value || '';
  const deptFilter  = (document.getElementById('db-dept-filter') || {}).value || '';
  const typeFilter  = (document.getElementById('db-type-filter') || {}).value || '';

  // Set loading states di semua 3 sub-tabs
  ['db-kehadiran-summary','db-kehadiran-kanban',
   'db-terlambat-summary','db-terlambat-kanban',
   'db-lembur-summary','db-lembur-kanban'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<div class="loading">Memuat...</div>';
  });

  google.script.run
    .withFailureHandler(err => {
      const msg = escHtml(getErrorMessage(err));
      ['db-kehadiran-kanban','db-terlambat-kanban','db-lembur-kanban'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<div class="loading">Gagal memuat: ${msg}</div>`;
      });
    })
    .withSuccessHandler(res => {
      if (!res || !res.ok) {
        const msg = escHtml((res && res.msg) || 'Gagal memuat data kehadiran.');
        ['db-kehadiran-kanban','db-terlambat-kanban','db-lembur-kanban'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = `<div class="loading">${msg}</div>`;
        });
        return;
      }
      STATE.dashboard.kehadiranData   = res;
      STATE.dashboard.kehadiranLoaded = true;

      // Update KPI cards di stat-grid
      updateKehadiranKPI(res.summary);

      // Render kanban kehadiran
      const kehEl = document.getElementById('db-kehadiran-kanban');
      const kehSumEl = document.getElementById('db-kehadiran-summary');
      if (kehEl)    kehEl.innerHTML    = renderKehadiranKanban(res.kehadiranList);
      if (kehSumEl) kehSumEl.innerHTML = renderKehadiranSummary(res.summary);

      // Render kanban keterlambatan
      const trlEl    = document.getElementById('db-terlambat-kanban');
      const trlSumEl = document.getElementById('db-terlambat-summary');
      if (trlEl)    trlEl.innerHTML    = renderKeterlambatanKanban(res.kehadiranList);
      if (trlSumEl) trlSumEl.innerHTML = renderKeterlambatanSummary(res.summary);

      // Render kanban lembur
      const lmbEl    = document.getElementById('db-lembur-kanban');
      const lmbSumEl = document.getElementById('db-lembur-summary');
      if (lmbEl)    lmbEl.innerHTML    = renderLemburKanban(res.kehadiranList);
      if (lmbSumEl) lmbSumEl.innerHTML = renderLemburSummary(res.summary);
    })
    .getKehadiranDashboard(tanggal, shiftFilter, deptFilter, typeFilter);
}

function updateKehadiranKPI(summary) {
  if (!summary) return;
  const terlambat = (summary.totalTerlambat || {});
  const total = (terlambat.ringan || 0) + (terlambat.sedang || 0) + (terlambat.berat || 0);
  const tEl = document.getElementById('db-terlambat');
  const lEl = document.getElementById('db-lembur');
  const aEl = document.getElementById('db-anomali');
  if (tEl) tEl.textContent = total;
  if (lEl) lEl.textContent = summary.totalLembur || 0;
  if (aEl) aEl.textContent = summary.totalAnomali || 0;
}

function renderShiftCoverage(shiftCoverage) {
  if (!Array.isArray(shiftCoverage) || !shiftCoverage.length) {
    return '<div class="loading">Data shift belum tersedia.</div>';
  }
  return `<div class="shift-coverage-grid">${shiftCoverage.map(s => {
    const pct     = s.coverage_pct;
    const hasPct  = pct !== null && pct !== undefined;
    const barW    = hasPct ? Math.min(100, pct) : 0;
    const barCls  = hasPct ? (pct < 70 ? 'coverage-bar-low' : pct < 90 ? 'coverage-bar-mid' : 'coverage-bar-ok') : '';
    const coverageHtml = hasPct
      ? `<div class="shift-coverage-bar-wrap">
           <div class="shift-coverage-bar ${barCls}" style="width:${barW}%"></div>
         </div>
         <div class="shift-stat ${pct < 70 ? 'warn' : ''}">
           <span>Coverage</span>
           <strong>${pct}%</strong>
         </div>
         <div class="shift-stat"><span>Expected</span><strong>${s.expected || 0} orang</strong></div>`
      : `<div class="shift-stat" style="color:#aaa;font-size:11px"><span>Jadwal belum diisi</span><strong>-</strong></div>`;
    return `<div class="shift-coverage-col">
      <div class="shift-label">${escHtml(s.label)}</div>
      <div class="shift-stat"><span>Hadir</span><strong>${s.hadir || 0} orang</strong></div>
      <div class="shift-stat warn"><span>Terlambat</span><strong>${s.terlambat || 0}</strong></div>
      <div class="shift-stat info"><span>Lembur</span><strong>${s.lembur || 0}</strong></div>
      ${coverageHtml}
    </div>`;
  }).join('')}</div>`;
}

function renderKehadiranSummary(summary) {
  if (!summary) return '';
  const t = summary.totalTerlambat || {};
  return `<div class="kehadiran-summary-bar">
    <span class="keh-chip belum">Belum Masuk: ${summary.totalBelumMasuk || 0}</span>
    <span class="keh-chip dalam">Di Dalam: ${(summary.totalHadir || 0) - (summary.totalSudahPulang || 0) - (summary.totalAnomali || 0)}</span>
    <span class="keh-chip pulang">Sudah Pulang: ${summary.totalSudahPulang || 0}</span>
    <span class="keh-chip anomali">Anomali: ${summary.totalAnomali || 0}</span>
  </div>`;
}

function renderKehadiranKanban(kehadiranList) {
  const COLS = [
    { key: 'belum_masuk', label: 'BELUM MASUK',  cls: 'col-belum'  },
    { key: 'di_dalam',    label: 'DI DALAM',      cls: 'col-dalam'  },
    { key: 'sudah_pulang',label: 'SUDAH PULANG',  cls: 'col-pulang' },
    { key: 'anomali',     label: 'ANOMALI',        cls: 'col-anomali'}
  ];
  const grouped = {};
  COLS.forEach(c => { grouped[c.key] = []; });
  (kehadiranList || []).forEach(item => {
    const key = item.presenceStatus || 'belum_masuk';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  });

  return `<div class="dashboard-kanban">${COLS.map(col => {
    const items = grouped[col.key] || [];
    return `<div class="kanban-column ${col.cls}">
      <div class="kanban-column-head">
        <strong>${col.label}</strong>
        <span>${items.length} orang</span>
      </div>
      <div class="kanban-cards">
        ${items.length === 0
          ? '<div class="loading" style="font-size:12px;padding:8px">Kosong</div>'
          : items.map(item => renderKehadiranCard(item)).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderKehadiranCard(item) {
  const statusCls = {
    belum_masuk: 'status-belum', di_dalam: 'status-dalam',
    sudah_pulang: 'status-pulang', anomali: 'status-anomali'
  }[item.presenceStatus] || 'status-belum';

  const shiftBadge = item.shift ? `<span class="badge-shift">${escHtml(item.shift)}</span>` : '';
  const jamMasukStr  = item.jamMasuk  ? `Masuk: ${item.jamMasuk}`  : 'Belum masuk';
  const jamKeluarStr = item.jamKeluar ? ` · Keluar: ${item.jamKeluar}` : '';
  const lateStr = item.lateMinutes > 0
    ? `<span style="color:#e65100">Terlambat ${item.lateMinutes} mnt</span>`
    : (item.lateMinutes !== null && item.lateMinutes <= 0 ? '<span style="color:#2d7a4a">On time</span>' : '');
  const anomaliStr = (item.anomali || []).map(a =>
    `<span style="color:#b71c1c">${escHtml(a)}</span>`).join(' · ');

  return `<div class="kanban-card ${statusCls}" onclick="this.classList.toggle('expanded')">
    <strong>${escHtml(item.nama || '-')}${shiftBadge}</strong>
    <span>${escHtml(item.nik || '-')} · ${escHtml(item.dept || '-')}</span>
    <span>${escHtml(item.type || '-')}</span>
    <div class="kanban-card-detail">
      <span>${jamMasukStr}${jamKeluarStr}</span>
      ${lateStr ? `<span>${lateStr}</span>` : ''}
      ${item.overtimeMinutes > 0 ? `<span style="color:#283593">Lembur ${item.overtimeMinutes} mnt</span>` : ''}
      ${anomaliStr ? `<span>${anomaliStr}</span>` : ''}
    </div>
  </div>`;
}

// ── RENDER: KETERLAMBATAN KANBAN ────────────────────────────

function renderKeterlambatanSummary(summary) {
  if (!summary) return '';
  const t = summary.totalTerlambat || {};
  return `<div class="kehadiran-summary-bar">
    <span class="keh-chip ontime">On Time: ${summary.totalOnTime || 0}</span>
    <span class="keh-chip ringan">Ringan (&lt;15 mnt): ${t.ringan || 0}</span>
    <span class="keh-chip sedang">Sedang (15-29 mnt): ${t.sedang || 0}</span>
    <span class="keh-chip berat">Berat (&ge;30 mnt): ${t.berat || 0}</span>
  </div>`;
}

function renderKeterlambatanKanban(kehadiranList) {
  const COLS = [
    { key: 'ontime', label: 'ON TIME',      cls: 'col-ontime', minMnt: null, maxMnt: 0  },
    { key: 'ringan', label: '< 15 MENIT',   cls: 'col-ringan', minMnt: 1,    maxMnt: 14 },
    { key: 'sedang', label: '15 – 29 MENIT',cls: 'col-sedang', minMnt: 15,   maxMnt: 29 },
    { key: 'berat',  label: '≥ 30 MENIT',   cls: 'col-berat',  minMnt: 30,   maxMnt: null}
  ];
  // Hanya yang sudah masuk
  const hadir = (kehadiranList || []).filter(i => i.presenceStatus !== 'belum_masuk' && i.jamMasuk);
  const grouped = { ontime: [], ringan: [], sedang: [], berat: [] };
  hadir.forEach(item => {
    const cat = item.lateCategory || 'ontime';
    if (grouped[cat]) grouped[cat].push(item);
  });
  // Sort: terlambat terbanyak di atas
  ['ringan','sedang','berat'].forEach(k => {
    grouped[k].sort((a,b) => (b.lateMinutes||0) - (a.lateMinutes||0));
  });

  return `<div class="dashboard-kanban">${COLS.map(col => {
    const items = grouped[col.key] || [];
    return `<div class="kanban-column ${col.cls}">
      <div class="kanban-column-head">
        <strong>${col.label}</strong>
        <span>${items.length} orang</span>
      </div>
      <div class="kanban-cards">
        ${items.length === 0
          ? '<div class="loading" style="font-size:12px;padding:8px">Kosong</div>'
          : items.map(item => {
              const lateStr = item.lateMinutes > 0 ? `+${item.lateMinutes} mnt` : 'On time';
              const shiftBadge = item.shift ? `<span class="badge-shift">${escHtml(item.shift)}</span>` : '';
              return `<div class="kanban-card status-${col.key}" onclick="this.classList.toggle('expanded')">
                <strong>${escHtml(item.nama || '-')}${shiftBadge}</strong>
                <span>${escHtml(item.dept || '-')} · ${escHtml(item.type || '-')}</span>
                <span>Masuk: ${item.jamMasuk || '-'}</span>
                <div class="kanban-card-detail">
                  <span style="font-weight:700">${lateStr}</span>
                  <span>NIK: ${escHtml(item.nik || '-')}</span>
                  <span>Jabatan: ${escHtml(item.jabatan || '-')}</span>
                </div>
              </div>`;
            }).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderLemburSummary(summary) {
  if (!summary) return '';
  return `<div class="kehadiran-summary-bar">
    <span class="keh-chip lembur">Total Lembur: ${summary.totalLembur || 0} orang</span>
  </div>`;
}

function renderLemburKanban(kehadiranList) {
  const hadir = (kehadiranList || []).filter(i => i.overtimeMinutes > 0);
  hadir.sort((a,b) => (b.overtimeMinutes||0) - (a.overtimeMinutes||0));

  const COLS = [
    { key: 'lembur1', label: '< 1 JAM',  min: 1,   max: 59   },
    { key: 'lembur2', label: '1 – 2 JAM',min: 60,  max: 119  },
    { key: 'lembur3', label: '> 2 JAM',  min: 120, max: 99999}
  ];
  const grouped = { lembur1: [], lembur2: [], lembur3: [] };
  hadir.forEach(item => {
    const m = item.overtimeMinutes || 0;
    if (m < 60)       grouped.lembur1.push(item);
    else if (m < 120) grouped.lembur2.push(item);
    else              grouped.lembur3.push(item);
  });

  if (!hadir.length) {
    return '<div class="loading">Tidak ada lembur pada basis ini.</div>';
  }

  return `<div class="dashboard-kanban">${COLS.map(col => {
    const items = grouped[col.key] || [];

function updatePeriodInput(target) {
  const typeEl = document.getElementById(target + '-period-type');
  const valueEl = document.getElementById(target + '-period-value');
  if (!typeEl || !valueEl) return;

  valueEl.type = typeEl.value;
  valueEl.value = getDefaultPeriodValue(typeEl.value);
}

function getDefaultPeriodValue(type) {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  if (type === 'date') return `${yyyy}-${mm}-${dd}`;
  if (type === 'month') return `${yyyy}-${mm}`;
  if (type === 'week') return getIsoWeekValue(now);
  return '';
}

function getIsoWeekValue(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

function buildAbsenPaginationControls(currentPage, totalPages) {
  if (!totalPages || totalPages <= 1) return '';

  const pages = [];
  function addPage(page) {
    if (page >= 1 && page <= totalPages && pages.indexOf(page) === -1) pages.push(page);
  }

  addPage(1);
  addPage(totalPages);
  for (let page = currentPage - 1; page <= currentPage + 1; page++) addPage(page);
  if (currentPage <= 3) {
    addPage(2);
    addPage(3);
    addPage(4);
  }
  if (currentPage >= totalPages - 2) {
    addPage(totalPages - 1);
    addPage(totalPages - 2);
    addPage(totalPages - 3);
  }

  pages.sort(function(a, b) { return a - b; });

  const parts = [
    `<button type="button" class="pg-btn" data-action="change-absen-page" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>`
  ];

  let previousPage = 0;
  pages.forEach(function(page) {
    if (previousPage && page - previousPage > 1) {
      parts.push('<button type="button" class="pg-btn" disabled>...</button>');
    }
    parts.push(
      `<button type="button" class="pg-btn ${page === currentPage ? 'pg-active' : ''}" data-action="change-absen-page" data-page="${page}" ${page === currentPage ? 'disabled' : ''}>${page}</button>`
    );
    previousPage = page;
  });

  parts.push(
    `<button type="button" class="pg-btn" data-action="change-absen-page" data-page="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>`
  );

  return parts.join('');
}

function renderAbsenReport(res) {

    list.innerHTML = '<div class="loading">Data tidak dapat ditampilkan.</div>';

  }
  REPORT_CACHE.absen = res;
  if (exportBtn) exportBtn.disabled = !res.data.length;
  showResult('cek-absen', 'success', `Periode ${escHtml(res.period)} - ${res.total} catatan`);

  const role = STATE.currentUser ? STATE.currentUser.role : 'KARYAWAN';
  const isKaryawan = role === 'KARYAWAN' || role === 'Karyawan';
  const currentPage = Math.max(1, parseInt(res.page, 10) || 1);
  const totalPages = Math.max(1, parseInt(res.totalPages, 10) || 1);
  const startRow = Math.max(0, parseInt(res.startRow, 10) || 0);
  const endRow = Math.max(0, parseInt(res.endRow, 10) || 0);
  const paginationControls = buildAbsenPaginationControls(currentPage, totalPages);
  const paginationSummary = res.total
    ? `Menampilkan ${startRow}-${endRow} dari ${res.total} catatan`
    : 'Tidak ada catatan pada periode ini';
  const paginationHtml = `
    <div class="pagination-bar">
      <div class="small text-muted">${escHtml(paginationSummary)}</div>
      ${paginationControls ? `<div class="pagination-controls">${paginationControls}</div>` : ''}
    </div>
  `;
  
  let tableHeader = '';
  if (isKaryawan) {
    tableHeader = `<tr><th>Nama</th><th>Tanggal</th><th>Jam Masuk</th><th>Jam Keluar</th><th>No Kartu</th><th>No Loker</th></tr>`;
  } else {
    tableHeader = `<tr><th>Nama</th><th>NIK</th><th>Departemen</th><th>Tanggal</th><th>Jam Masuk</th><th>Jam Keluar</th><th>Status</th></tr>`;
  }

  let tableRows = '';
  if (!res.data.length) {
    const colSpan = isKaryawan ? 6 : 7;
    tableRows = `<tr><td colspan="${colSpan}" class="text-center" style="padding: 24px; color: #777;">Tidak ada catatan absen untuk NIK dan periode ini.</td></tr>`;
  } else {
    tableRows = res.data.map(row => {
      if (isKaryawan) {
        return `<tr>
          <td>${escHtml(row.nama || row.nik)}</td>
          <td>${escHtml(row.tanggal)}</td>
          <td>${escHtml(row.jamMasuk || '-')}</td>
          <td>${escHtml(row.jamKeluar || '-')}</td>
          <td>${escHtml(row.noKartuMK || '-')}</td>
          <td>${escHtml(row.noLoker || '-')}</td>
        </tr>`;
      } else {
        return `<tr>
          <td>${escHtml(row.nama || row.nik)}</td>
          <td>${escHtml(row.nik)}</td>
          <td>${escHtml(row.dept || '-')}</td>
          <td>${escHtml(row.tanggal)}</td>
          <td>${escHtml(row.jamMasuk || '-')}</td>
          <td>${escHtml(row.jamKeluar || '-')}</td>
          <td><span class="badge ${row.status === 'SELESAI' ? 'bg-secondary' : 'bg-success'}">${escHtml(row.status || '-')}</span></td>
        </tr>`;
      }
    }).join('');
  }

  list.innerHTML = `
    <div class="report-summary">
      <div class="summary-box"><strong>${res.total}</strong><span>Total</span></div>
      <div class="summary-box"><strong>${res.complete}</strong><span>Selesai</span></div>
      <div class="summary-box"><strong>${res.active}</strong><span>Aktif</span></div>
    </div>
    ${paginationHtml}
    <div class="table-responsive mt-3">
      <table class="table table-bordered table-striped table-hover align-middle">
        <thead class="table-dark">
          ${tableHeader}
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
    ${paginationHtml}
  `;
}

function csvCell(value) {
  const text = (value === null || value === undefined) ? '' : String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

function downloadTextFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  window.setTimeout(() => {
    URL.revokeObjectURL(url);
    link.remove();
  }, 1000);
}

            <span class="time-pill ${row.inout === 'OUT' ? 'out' : ''}">${escHtml(row.inout)}</span>
            <span class="time-pill">Kartu ${escHtml(row.noKartuMK || '-')}</span>
          </div>
        </div>
      </div>`).join('')}
  `;

  // 2. RENDER REKAP HITUNGAN
  if (rekapList) {
    let tableRows = '';
    
    if (!res.data.length) {
      tableRows = '<tr><td colspan="5" class="text-center" style="padding: 24px; color: #777;">Tidak ada data untuk direkap.</td></tr>';
    } else {
      const recapMap = {};
      res.data.forEach(row => {
        const id = row.nik || 'UNKNOWN';
        if (!recapMap[id]) {
          recapMap[id] = { nik: id, nama: row.nama, dept: row.dept, in: 0, out: 0, total: 0 };
        }
        recapMap[id].total++;
        if (row.inout === 'IN') recapMap[id].in++;
        else recapMap[id].out++;
      });

      const recapArr = Object.values(recapMap).sort((a,b) => b.total - a.total);
      
      tableRows = recapArr.map(r => `
        <tr>
          <td>${escHtml(r.nama || r.nik)}</td>
          <td>${escHtml(r.nik)}</td>
          <td><span class="badge bg-primary" style="font-size:14px; padding:6px 10px;">${r.total}x</span></td>
          <td><span class="badge bg-success" style="font-size:13px;">${r.in} Masuk</span></td>
          <td><span class="badge bg-warning text-dark" style="font-size:13px;">${r.out} Keluar</span></td>
        </tr>
      `).join('');
    }

    rekapList.innerHTML = `
      <div class="table-responsive mt-2">
        <table class="table table-bordered table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Nama Karyawan</th>
              <th>NIK</th>
              <th>Total Aktivitas</th>
              <th>IN</th>
              <th>OUT</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
          </tbody>
        </table>
      </div>
    `;
  }
}

function showResult(context, type, html) {
  const el = document.getElementById(context + '-result');
  if (!el) return;
  el.className = 'result-card ' + type;
  el.innerHTML = html;
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getErrorMessage(err) {
  return (err && (err.message || err.toString())) || 'Terjadi kesalahan koneksi.';
}

function handleGasFailure(context, err) {
  showResult(context, 'error', 'Gagal menghubungi server: ' + escHtml(getErrorMessage(err)));
}

function setActionBusy(action, isBusy) {
  document.querySelectorAll(`[data-action="${action}"]`).forEach(el => {
    el.disabled = isBusy;
    el.setAttribute('aria-busy', isBusy ? 'true' : 'false');
    if (isBusy) {
      if (!el.dataset.originalHtml) el.dataset.originalHtml = el.innerHTML;
      el.classList.add('pulse-anim');
      el.innerHTML = 'Memproses...';
    } else {
      el.classList.remove('pulse-anim');
      if (el.dataset.originalHtml) el.innerHTML = el.dataset.originalHtml;
    }
  });
}

function normalizeSerial(value) {
  return (value || '').toString().trim().toUpperCase().replace(/\s+/g, '');
}

function isValidSerial(value) {
  return /^[A-Z0-9_-]{3,32}$/.test(value || '');
}

// Kartu/QR harus terbaca dengan nilai yang SAMA selama minimal ini sebelum
// diterima — 1 frame blur/pantulan cahaya kamera tidak lagi cukup untuk
// misread. Murni logic client-side (requestAnimationFrame/decode callback),
// tidak menyentuh eksekusi server GAS sama sekali.
const SCAN_STABLE_MS = 400;

function isSerialStable(serial) {
  const now = Date.now();
  if (QR.pendingValue !== serial) {
    QR.pendingValue = serial;
    QR.pendingSince = now;
    return false;
  }
  return (now - QR.pendingSince) >= SCAN_STABLE_MS;
}

function resetScanStability() {
  QR.pendingValue = null;
  QR.pendingSince = 0;
}

function resetSerialInput(context) {
  const input = document.getElementById(context + '-serial');
  const result = document.getElementById(context + '-result');
  if (input) input.value = '';
  if (result) {
    result.className = 'result-card';
    result.innerHTML = '';

  if (context === 'masuk') {
    STATE.masuk.scannedSerial = null;
    STATE.masuk.completed = false;

    const cardNum = document.getElementById('masuk-card-num');
    if (display) display.style.display = 'none';

    checkMasukReady();
  } else if (context === 'keluar') {
    STATE.keluar.scannedSerial = null;
    STATE.keluar.bindingData = null;
    resetKeluarUi();
  } else if (context === 'security') {

  }

  setRescanVisibility(context, false);
}

function resetAllSerialInputs() {

}

function forceClearSerialInputs() {

function waitForVisibleScanner() {

}

function getScannerFormats() {
  if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  return [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.CODABAR,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.UPC_EAN_EXTENSION,
    Html5QrcodeSupportedFormats.PDF_417,
    Html5QrcodeSupportedFormats.DATA_MATRIX,
    Html5QrcodeSupportedFormats.AZTEC
  ].filter(format => format !== undefined);
}

async function getNativeBarcodeFormats() {
  const wanted = [
    'qr_code',
    'code_128',
    'code_39',
    'code_93',
    'codabar',
    'itf',
    'ean_8',
    'ean_13',
    'upc_a',
    'upc_e',
    'pdf417',
    'data_matrix',
    'aztec'
  ];

  if (typeof BarcodeDetector === 'undefined') return wanted;
  if (typeof BarcodeDetector.getSupportedFormats !== 'function') return wanted;

  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    return wanted.filter(format => supported.includes(format));
  } catch (err) {
    return wanted;
  }
}

function getImageSourceSize(source) {
  return {
    width: source.videoWidth || source.naturalWidth || source.width || 0,
    height: source.videoHeight || source.naturalHeight || source.height || 0
  };
}

function buildProcessedCanvas(source, options) {
  const size = getImageSourceSize(source);
  const sx = Math.max(0, Math.floor((options.sx || 0) * size.width));
  const sy = Math.max(0, Math.floor((options.sy || 0) * size.height));
  const sw = Math.max(1, Math.floor((options.sw || 1) * size.width));
  const sh = Math.max(1, Math.floor((options.sh || 1) * size.height));
  const rotate = options.rotate || 0;
  const scale = options.scale || 1;
  const drawWidth = Math.max(1, Math.floor(sw * scale));
  const drawHeight = Math.max(1, Math.floor(sh * scale));
  const swap = rotate === 90 || rotate === 270;

  const canvas = document.createElement('canvas');
  canvas.width = swap ? drawHeight : drawWidth;
  canvas.height = swap ? drawWidth : drawHeight;

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (swap) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((rotate * Math.PI) / 180);
    ctx.drawImage(source, sx, sy, sw, sh, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
  } else if (rotate === 180) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI);
    ctx.drawImage(source, sx, sy, sw, sh, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
  } else {
    ctx.drawImage(source, sx, sy, sw, sh, 0, 0, drawWidth, drawHeight);
  }

  if (options.threshold || options.grayscale) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    let total = 0;

    for (let i = 0; i < data.length; i += 4) {
      const gray = Math.round((data[i] * 0.299) + (data[i + 1] * 0.587) + (data[i + 2] * 0.114));
      data[i] = gray;
      data[i + 1] = gray;
      data[i + 2] = gray;
      total += gray;
    }

    if (options.threshold) {
      const avg = total / Math.max(1, data.length / 4);
      const threshold = Math.max(90, Math.min(190, Math.round(avg)));
      for (let i = 0; i < data.length; i += 4) {
        const value = data[i] >= threshold ? 255 : 0;
        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;
      }
    }

    ctx.putImageData(imageData, 0, 0);
  }

  return canvas;
}

function buildBarcodeScanVariants(source) {
  const variants = [
    { label: 'full-color', sx: 0, sy: 0, sw: 1, sh: 1, scale: 1.6 },
    { label: 'full-rot90', sx: 0, sy: 0, sw: 1, sh: 1, scale: 1.6, rotate: 90 },
    { label: 'full-rot270', sx: 0, sy: 0, sw: 1, sh: 1, scale: 1.6, rotate: 270 },
    { label: 'full-threshold', sx: 0, sy: 0, sw: 1, sh: 1, scale: 2.1, threshold: true },
    { label: 'bottom-strip', sx: 0.05, sy: 0.52, sw: 0.9, sh: 0.36, scale: 2.4, threshold: true },
    { label: 'left-strip-rot90', sx: 0.02, sy: 0.18, sw: 0.46, sh: 0.64, scale: 2.4, threshold: true, rotate: 90 },
    { label: 'left-strip-rot270', sx: 0.02, sy: 0.18, sw: 0.46, sh: 0.64, scale: 2.4, threshold: true, rotate: 270 },
    { label: 'right-strip-rot90', sx: 0.5, sy: 0.1, sw: 0.46, sh: 0.8, scale: 2.1, grayscale: true, rotate: 90 },
    { label: 'right-strip-rot270', sx: 0.5, sy: 0.1, sw: 0.46, sh: 0.8, scale: 2.1, grayscale: true, rotate: 270 }
  ];

  return variants.map(variant => ({
    label: variant.label,
    canvas: buildProcessedCanvas(source, variant)
  }));
}

function buildOcrVariants(source) {
  const variants = [
    { label: 'ocr-full-rot90', sx: 0, sy: 0, sw: 1, sh: 1, scale: 1.6, grayscale: true, rotate: 90 },
    { label: 'ocr-full-rot270', sx: 0, sy: 0, sw: 1, sh: 1, scale: 1.6, grayscale: true, rotate: 270 },
    { label: 'ocr-right', sx: 0.5, sy: 0.08, sw: 0.45, sh: 0.84, scale: 2.2, threshold: true, rotate: 90 },
    { label: 'ocr-right-alt', sx: 0.5, sy: 0.08, sw: 0.45, sh: 0.84, scale: 2.2, threshold: true, rotate: 270 }
  ];

  return variants.map(variant => ({
    label: variant.label,
    canvas: buildProcessedCanvas(source, variant)
  }));
}

function extractSerialFromText(rawText) {
  const source = String(rawText || '').toUpperCase();
  const normalized = source
    .replace(/[|]/g, '1')
    .replace(/[O]/g, '0')
    .replace(/[^A-Z0-9_-]+/g, ' ');

  const patterns = [
    /MK[\s:_-]*\d{4,}/g,
    /\b[A-Z]{1,4}[\s:_-]*\d{4,12}\b/g,
    /\b\d{7,12}\b/g
  ];

  for (const pattern of patterns) {
    const matches = normalized.match(pattern) || [];
    for (const match of matches) {
      const candidate = normalizeSerial(match.replace(/[\s:_-]+/g, ''));
      if (candidate && isValidSerial(candidate)) return candidate;
    }
  }

  return '';
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = err => {
      URL.revokeObjectURL(url);
      reject(err);
    };
    img.src = url;
  });
}

function ensureTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (QR.tesseractLoader) return QR.tesseractLoader;

  QR.tesseractLoader = new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-lib="tesseract-js"]');
    if (existing) {
      existing.addEventListener('load', () => resolve(window.Tesseract), { once: true });
      existing.addEventListener('error', reject, { once: true });
      return;
    }

    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.async = true;
    script.dataset.lib = 'tesseract-js';
    script.onload = () => resolve(window.Tesseract);
    script.onerror = () => reject(new Error('Library OCR gagal dimuat.'));
    document.head.appendChild(script);
  });

  return QR.tesseractLoader;
}

async function detectBarcodeFromSource(source) {
  if (typeof BarcodeDetector === 'undefined') return '';
  const formats = await getNativeBarcodeFormats();
  const detector = new BarcodeDetector({ formats });
  const variants = buildBarcodeScanVariants(source);

  for (const variant of variants) {
    try {
      const barcodes = await detector.detect(variant.canvas);
      if (barcodes && barcodes.length) {
        const rawValue = (barcodes.find(item => item && item.rawValue) || barcodes[0]).rawValue || '';
        const serial = normalizeSerial(rawValue);
        if (serial && isValidSerial(serial)) {
          setQRDiagnostic('Barcode terbaca dari varian gambar: ' + variant.label);
          return serial;
        }
      }
    } catch (err) {
      console.warn('Barcode variant failed', variant.label, err);
    }
  }

  return '';
}

async function detectTextSerialFromSource(source) {
  const Tesseract = await ensureTesseract();
  const variants = buildOcrVariants(source);

  for (const variant of variants) {
    document.getElementById('qr-result-text').textContent = 'Membaca teks kartu...';
    try {
      const result = await Tesseract.recognize(variant.canvas, 'eng', {
        tessedit_pageseg_mode: '6',
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'
      });
      const serial = extractSerialFromText(result && result.data && result.data.text);
      if (serial) {
        setQRDiagnostic('Serial ditemukan dari OCR varian: ' + variant.label);
        return serial;
      }
    } catch (err) {
      console.warn('OCR variant failed', variant.label, err);
    }
  }

  return '';
}

async function getCameraPermissionState() {
  if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
  try {
    const status = await navigator.permissions.query({ name: 'camera' });
    return status.state || 'unknown';
  } catch(err) {
    return 'unknown';
  }
}

function getCameraPolicyState() {
  try {
    if (document.permissionsPolicy && document.permissionsPolicy.allowsFeature) {
      return document.permissionsPolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
    }
    if (document.featurePolicy && document.featurePolicy.allowsFeature) {
      return document.featurePolicy.allowsFeature('camera') ? 'allowed' : 'blocked';
    }
  } catch(err) {
    return 'unknown';
  }
  return 'unknown';
}

function isTopWindow() {
  try {
    return window.self === window.top;
  } catch(err) {
    return false;
  }
}

function buildCameraDiagnostic(permissionState, policyState, mode) {
  return [
    'Mode: ' + mode,
    'Permission: ' + permissionState,
    'Policy: ' + policyState,
    'HTTPS: ' + (window.isSecureContext ? 'yes' : 'no'),
    'Top frame: ' + (isTopWindow() ? 'yes' : 'no'),
    'getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'available' : 'missing')
  ].join(' | ');
}

function normalizeCameraError(err) {
  const rawMessage = err && (err.message || err.name || String(err));
  const message = rawMessage || 'Browser belum memberi akses kamera.';

  if (err && err.code === 'CAMERA_POLICY_BLOCKED') {
    return {
      title: 'Akses kamera diblokir browser',
      msg: 'Browser memblokir kamera untuk konteks halaman ini sebelum prompt izin bisa muncul. Buka URL web app hasil deployment /exec langsung di Chrome, bukan preview editor, lalu coba SCAN QR lagi.'
    };
  }

  if (err && err.code === 'CAMERA_PERMISSION_DENIED_STICKY') {
    return {
      title: 'Izin kamera sudah ditolak',
      msg: 'Browser sudah menyimpan status kamera sebagai Block/Deny untuk halaman ini, jadi prompt tidak akan muncul lagi. Reset izin dari ikon gembok di address bar atau Site settings > Camera > Allow, lalu muat ulang aplikasi.'
    };
  }

  if (err && err.code === 'INSECURE_CONTEXT') {
    return {
      title: 'Kamera butuh HTTPS',
      msg: 'Browser hanya membuka kamera pada halaman HTTPS yang aman. Gunakan URL deployment Apps Script yang diawali https://script.google.com/.../exec.'
    };
  }

  if (err && err.code === 'NO_BARCODE_DETECTOR') {
    return {
      title: 'Scanner native tidak tersedia',
      msg: 'Browser ini tidak menyediakan BarcodeDetector. Fallback scanner akan dicoba otomatis.'
    };
  }

  if (/notallowed|permission|denied|izin/i.test(message)) {
    return {
      title: 'Izin kamera belum aktif',
      msg: 'Browser menolak akses kamera. Jika prompt tidak muncul, reset izin kamera dari ikon gembok di address bar atau Site settings > Camera > Allow, lalu muat ulang aplikasi.'
    };
  }

  if (/notfound|devicesnotfound|no camera/i.test(message)) {
    return {
      title: 'Kamera tidak ditemukan',
      msg: 'Perangkat tidak mengembalikan kamera yang bisa dipakai oleh browser.'
    };
  }

  if (/notreadable|trackstart|in use|busy/i.test(message)) {
    return {
      title: 'Kamera sedang dipakai',
      msg: 'Tutup aplikasi lain yang memakai kamera, lalu klik SCAN QR lagi.'
    };
  }

  return {
    title: 'Kamera gagal dibuka',
    msg: message + '\n\nKlik SCAN QR lagi dan pilih Izinkan/Allow jika prompt kamera muncul.'
  };
}

function requestNativeCameraStream() {
  if (!window.isSecureContext) {
    const err = new Error('Halaman bukan secure context.');
    err.code = 'INSECURE_CONTEXT';
    throw err;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Browser tidak menyediakan akses kamera.');
  }
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  });
}

async function startNativeCameraScanner(stream) {
  if (typeof BarcodeDetector === 'undefined') {
    const err = new Error('BarcodeDetector tidak tersedia.');
    err.code = 'NO_BARCODE_DETECTOR';
    throw err;
  }

  const reader = document.getElementById('qr-reader');
  if (!reader) {
    if (stream && stream.getTracks) {
      stream.getTracks().forEach(track => track.stop());
    }
    throw new Error('Elemen scanner tidak ditemukan.');
  }

  reader.innerHTML = '';

  const video = document.createElement('video');
  video.className = 'qr-video';
  video.setAttribute('playsinline', 'true');
  video.setAttribute('muted', 'true');
  video.setAttribute('autoplay', 'true');
  video.srcObject = stream;
  reader.appendChild(video);

  QR.stream = stream;
  QR.video = video;
  const nativeFormats = await getNativeBarcodeFormats();
  QR.detector = new BarcodeDetector({ formats: nativeFormats });
  QR.usingNative = true;
  QR.successHandled = false;

  await video.play();
  document.getElementById('qr-result-text').textContent = 'Kamera aktif. Arahkan ke barcode/QR.';

  const tick = async () => {
    if (!QR.isScanning || QR.successHandled || !QR.video) return;

    try {
      if (QR.video.readyState >= 2) {
        const barcodes = await QR.detector.detect(QR.video);
        if (barcodes && barcodes.length > 0) {
          const rawValue = (barcodes.find(item => item && item.rawValue) || barcodes[0]).rawValue || '';
          const serial = normalizeSerial(rawValue);
          if (serial && isValidSerial(serial)) {
            if (!isSerialStable(serial)) {
              document.getElementById('qr-result-text').textContent = 'Mengunci: ' + serial + '...';
            } else {
              QR.successHandled = true;
              indicateScanSuccess();
              document.getElementById('qr-result-text').textContent = 'Ditemukan: ' + serial;
              await stopQRScanner();
              onSerialScanned(QR.context, serial);
              return;
            }
          }
        }
      }
    } catch (err) {
      const message = String(err && (err.name || err.message || err));
      if (!/notfounderror|invalidstateerror|operationerror/i.test(message)) {
        setQRDiagnostic('Scanner native aktif, tapi barcode belum terbaca stabil. Coba dekatkan kartu dan kurangi silau.');
      }
    }

    if (QR.isScanning && !QR.successHandled) {
      QR.scanFrame = window.requestAnimationFrame(tick);
    }
  };

  QR.scanFrame = window.requestAnimationFrame(tick);
}

function showScanToast(message) {
  const toast = document.getElementById('scan-toast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showScanToast.timer);
  showScanToast.timer = window.setTimeout(() => toast.classList.remove('show'), 4500);
}

function indicateScanSuccess() {
  if (navigator.vibrate) navigator.vibrate(60);
  showScanToast('Scan berhasil');
}
