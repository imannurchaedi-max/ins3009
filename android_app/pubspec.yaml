name: dam_android_app
description: "DAM Access Control Flutter app"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_nfc_kit: ^3.3.0
  geolocator: ^12.0.0
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
